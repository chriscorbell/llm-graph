name: Refresh data

# Cloudflare Pages bakes Artificial Analysis data in at build time, so trigger a rebuild
# regularly to pick up new models. 6 builds/day x 4 API pages stays well under the free
# tier's 100 requests/day.
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger Cloudflare Pages build
        run: curl -fsS -X POST "$DEPLOY_HOOK" > /dev/null
        env:
          DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}

      # Public repos pause scheduled workflows after 60 days without commits; re-enabling resets the timer.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        run: gh workflow enable refresh.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
